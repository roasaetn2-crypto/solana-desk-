<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0a0810" />
  <title>Unlock — Solana Desk</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%90%B1%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body class="page-login">
  <div class="login-card">
    <div class="login-cat">
      <div class="cat-dock" data-mood="neutral" aria-hidden="true">
                        <div class="mascot-wrap" aria-hidden="true">
          <div class="mascot">
            <div class="mood mood-neutral">
              <img class="frame frame-open" src="/static/assets/cat/neutral.webp" width="512" height="512" alt="" decoding="async">
              <img class="frame frame-blink" src="/static/assets/cat/neutral-blink.webp" width="512" height="512" alt="" decoding="async">
            </div>
            <div class="mood mood-sleep">
              <img class="frame frame-open" src="/static/assets/cat/sleep.webp" width="512" height="512" alt="" decoding="async">
            </div>
            <div class="mood mood-scan">
              <img class="frame frame-a" src="/static/assets/cat/scan.webp" width="512" height="512" alt="" decoding="async">
              <img class="frame frame-b" src="/static/assets/cat/scan-look.webp" width="512" height="512" alt="" decoding="async">
              <img class="frame frame-blink" src="/static/assets/cat/scan-blink.webp" width="512" height="512" alt="" decoding="async">
            </div>
            <div class="mood mood-happy">
              <img class="frame frame-open" src="/static/assets/cat/happy.webp" width="512" height="512" alt="" decoding="async">
              <img class="frame frame-blink" src="/static/assets/cat/happy-blink.webp" width="512" height="512" alt="" decoding="async">
            </div>
            <div class="mood mood-sad">
              <img class="frame frame-open" src="/static/assets/cat/sad.webp" width="512" height="512" alt="" decoding="async">
              <img class="frame frame-blink" src="/static/assets/cat/sad-blink.webp" width="512" height="512" alt="" decoding="async">
            </div>
          </div>
          <svg class="fx-sparkles" viewBox="0 0 120 120" aria-hidden="true">
            <path class="sp s1" d="M18 22 L20.2 27.2 L25.6 29.4 L20.2 31.6 L18 36.8 L15.8 31.6 L10.4 29.4 L15.8 27.2 Z"/>
            <path class="sp s2" d="M98 16 L100 20.6 L104.8 22.8 L100 25 L98 29.6 L96 25 L91.2 22.8 L96 20.6 Z"/>
            <path class="sp s3" d="M104 58 L105.4 61.4 L109 62.8 L105.4 64.2 L104 67.6 L102.6 64.2 L99 62.8 L102.6 61.4 Z"/>
            <path class="sp s4" d="M12 64 L13.2 66.8 L16.2 68 L13.2 69.2 L12 72 L10.8 69.2 L7.8 68 L10.8 66.8 Z"/>
          </svg>
          <div class="fx-tear"></div>
          <div class="zzz"><span>z</span><span>z</span><span>z</span></div>
        </div>
      </div>
    </div>
    <h1>Solana Desk</h1>
    <p class="sub">This desk is locked. Enter the key, or pair this device so it never asks again.</p>
    <div class="speech login-speech">Psst… enter the key to wake me.</div>

    <form method="post" action="/login">
      <label>Access key</label>
      <input type="password" name="token" placeholder="••••••••"
             autofocus autocomplete="current-password" />
      <button type="submit">Unlock</button>
    </form>

    <div class="div">or</div>

    <form method="post" action="/pair">
      <label>Pair this device</label>
      <input type="text" name="name" placeholder="Device name (e.g. Pixel 7)" />
      <input type="password" name="token" placeholder="Access key (one time)" />
      <button class="ghost" type="submit">Pair &amp; stay signed in</button>
    </form>
    __ERROR__
  </div>
</body>
</html>
