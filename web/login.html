<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0a0810" />
  <title>Unlock — Solana Desk</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%90%B1%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body class="page-login">
  <div class="login-card">
    <div class="login-cat">
      <div class="cat-dock" data-mood="idle">
        <div class="mascot-wrap" aria-hidden="true">
          <div class="mascot">
            <div class="mood mood-idle" style="--frames:12;--frame-ms:160ms">
              <img class="gif-fallback" src="/static/assets/cat-pixel/idle.gif" width="192" height="192" alt="" decoding="async">
            </div>
            <div class="mood mood-scan" style="--frames:14;--frame-ms:160ms">
              <img class="gif-fallback" src="/static/assets/cat-pixel/scan.gif" width="192" height="192" alt="" decoding="async">
            </div>
            <div class="mood mood-trader" style="--frames:12;--frame-ms:160ms">
              <img class="gif-fallback" src="/static/assets/cat-pixel/trader.gif" width="192" height="192" alt="" decoding="async">
            </div>
            <div class="mood mood-win" style="--frames:12;--frame-ms:160ms">
              <img class="gif-fallback" src="/static/assets/cat-pixel/win.gif" width="192" height="192" alt="" decoding="async">
            </div>
            <div class="mood mood-loss" style="--frames:12;--frame-ms:160ms">
              <img class="gif-fallback" src="/static/assets/cat-pixel/loss.gif" width="192" height="192" alt="" decoding="async">
            </div>
            <div class="mood mood-sleep" style="--frames:16;--frame-ms:200ms">
              <img class="gif-fallback" src="/static/assets/cat-pixel/sleep.gif" width="192" height="192" alt="" decoding="async">
            </div>
          </div>
        </div>
      </div>
    </div>
    <h1>Solana Desk</h1>
    <p class="sub">This desk is locked. Enter the key, or pair this device so it never asks again.</p>
    <div class="speech login-speech">Psst… enter the key to wake me.</div>

    <form method="post" action="/login">
      <label>Access key</label>
      <input type="password" name="token" placeholder="••••••••"
             autofocus autocomplete="current-password" />
      <button type="submit">Unlock</button>
    </form>

    <div class="div">or</div>

    <form method="post" action="/pair">
      <label>Pair this device</label>
      <input type="text" name="name" placeholder="Device name (e.g. Pixel 7)" />
      <input type="password" name="token" placeholder="Access key (one time)" />
      <button class="ghost" type="submit">Pair &amp; stay signed in</button>
    </form>
    __ERROR__
  </div>
</body>
</html>
